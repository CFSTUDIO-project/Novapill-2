<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<title>NOVA PILL architecture: sources, coordinator, state machine, UI</title>
<style>
text{font-family:Inter,'DejaVu Sans',Helvetica,Arial,sans-serif;fill:#fff}
.ti{font-size:34px;font-weight:700}
.su{font-size:19px;fill-opacity:.6}
.ca{font-size:15px;fill-opacity:.4}
.h2{font-size:17px;font-weight:700}
.h3{font-size:20px;font-weight:700}
.m{font-size:16px;fill-opacity:.6}
.sm{font-size:13px;fill-opacity:.5}
.c{text-anchor:middle}
.box{fill:#0B0B0D;stroke:#fff;stroke-opacity:.3;stroke-width:1.5}
.ln{fill:none;stroke:#fff;stroke-opacity:.4;stroke-width:1.5}
.dash{fill:none;stroke:#fff;stroke-opacity:.45;stroke-width:1.5;stroke-dasharray:6 6}
.acs{fill:none;stroke:#E5173F;stroke-width:2}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fff" fill-opacity=".7"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5173F"/></marker>
</defs>
<rect width="1600" height="900" fill="#000"/>
<text x="80" y="92" class="ti">Architecture</text>
<text x="80" y="130" class="su">Sources report facts. One pure state machine decides. The UI draws one immutable value.</text>

<g class="ln">
<path d="M340 200L470 430"/><path d="M340 274L470 430"/><path d="M340 348L470 430"/><path d="M340 422L470 430"/>
<path d="M340 496L470 430"/><path d="M340 570L470 430"/><path d="M340 644L470 430"/><path d="M340 718L470 430"/>
</g>
<rect class="box" x="80" y="170" width="260" height="60" rx="10"/><text class="h2" x="98" y="196">Media and lyrics</text><text class="sm" x="98" y="217">MediaMonitor, LRCLIB</text>
<rect class="box" x="80" y="244" width="260" height="60" rx="10"/><text class="h2" x="98" y="270">Notifications</text><text class="sm" x="98" y="291">NotificationHub, replies</text>
<rect class="box" x="80" y="318" width="260" height="60" rx="10"/><text class="h2" x="98" y="344">Timer and stopwatch</text><text class="sm" x="98" y="365">ClockTools, TimerReceiver</text>
<rect class="box" x="80" y="392" width="260" height="60" rx="10"/><text class="h2" x="98" y="418">Flashlight</text><text class="sm" x="98" y="439">torch callback, tracker</text>
<rect class="box" x="80" y="466" width="260" height="60" rx="10"/><text class="h2" x="98" y="492">Screen recorder</text><text class="sm" x="98" y="513">RecorderService, hub</text>
<rect class="box" x="80" y="540" width="260" height="60" rx="10"/><text class="h2" x="98" y="566">Weather</text><text class="sm" x="98" y="587">Open-Meteo</text>
<rect class="box" x="80" y="614" width="260" height="60" rx="10"/><text class="h2" x="98" y="640">Battery</text><text class="sm" x="98" y="661">BatteryMonitor</text>
<rect class="box" x="80" y="688" width="260" height="60" rx="10"/><text class="h2" x="98" y="714">Record indicator</text><text class="sm" x="98" y="735">OS signal, manual timer</text>

<rect class="box" x="470" y="350" width="250" height="160" rx="14"/>
<text class="h3" x="490" y="396">IslandCoordinator</text>
<text class="m" x="490" y="432">single source of truth</text>
<text class="m" x="490" y="458">applies the state machine</text>
<text class="m" x="490" y="484">builds IslandUi</text>

<rect class="box" x="780" y="350" width="250" height="160" rx="14"/>
<text class="h3" x="800" y="396">IslandStateMachine</text>
<text class="m" x="800" y="432">pure Kotlin</text>
<text class="m" x="800" y="458">no Android imports</text>
<text class="m" x="800" y="484">unit-tested</text>

<rect class="box" x="1090" y="350" width="190" height="160" rx="14"/>
<text class="h3" x="1110" y="396">IslandUi</text>
<text class="m" x="1110" y="432">immutable value</text>
<text class="m" x="1110" y="458">one source for</text>
<text class="m" x="1110" y="484">everything drawn</text>

<rect class="box" x="1340" y="350" width="190" height="160" rx="14"/>
<text class="h3" x="1360" y="396">Compose UI</text>
<text class="m" x="1360" y="432">IslandRoot, panels</text>
<text class="m" x="1360" y="458">overlay window</text>

<path class="ln" marker-end="url(#ar)" d="M722 430H778"/>
<path class="ln" marker-end="url(#ar)" d="M1032 430H1088"/>
<path class="acs" marker-end="url(#aa)" d="M1282 430H1338"/>

<path class="dash" marker-end="url(#ar)" d="M1435 512V600H595V514"/>
<text class="m c" x="1015" y="590">IslandActions: taps and gestures go back to the coordinator</text>

<rect class="box" x="470" y="660" width="700" height="100" rx="14"/>
<text class="h3" x="490" y="700">Floating windows</text>
<text class="m" x="490" y="730">FloatingManager and FloatingCalculator draw their own overlay windows.</text>
<text class="sm" x="490" y="750">Internal windows, not windows of another app.</text>

<text x="80" y="866" class="ca">Design illustration, not a screenshot. Names are the real classes under app/src/main/java/app/novapill/android.</text>
</svg>
