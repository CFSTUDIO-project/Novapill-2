<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<title>NOVA PILL idle modes</title>
<style>
text{font-family:Inter,'DejaVu Sans',Helvetica,Arial,sans-serif;fill:#fff}
.ti{font-size:34px;font-weight:700}
.su{font-size:19px;fill-opacity:.6}
.ca{font-size:15px;fill-opacity:.4}
.h{font-size:22px;font-weight:700}
.b{font-size:17px;fill-opacity:.65}
.t{font-size:26px;font-weight:700}
.t2{font-size:22px;font-weight:700}
.p{font-size:18px;font-weight:600}
.box{fill:#0B0B0D;stroke:#fff;stroke-opacity:.3;stroke-width:1.5}
.pill{fill:#050506;stroke:#fff;stroke-opacity:.5;stroke-width:1.5}
.g{fill:none;stroke:#fff;stroke-opacity:.8;stroke-width:1.8}
.gf{fill:#fff;fill-opacity:.8}
</style>
<rect width="1600" height="900" fill="#000"/>
<text x="80" y="92" class="ti">Idle pill: three modes</text>
<text x="80" y="130" class="su">What the pill shows when nothing else is active. Set under Settings, Quick panel.</text>

<text class="h" x="80" y="240">Clock</text><text class="b" x="80" y="268">time only</text>
<rect class="pill" x="560" y="210" width="170" height="64" rx="32"/>
<text class="t" x="645" y="251" style="text-anchor:middle">12:45</text>

<text class="h" x="80" y="370">Clock and battery</text><text class="b" x="80" y="398">time, battery icon, percentage</text>
<rect class="pill" x="560" y="340" width="290" height="64" rx="32"/>
<text class="t" x="592" y="381">12:45</text>
<rect class="g" x="722" y="362" width="34" height="18" rx="4"/><rect class="gf" x="725" y="365" width="24" height="12" rx="2"/><rect class="gf" x="758" y="368" width="3" height="6"/>
<text class="p" x="772" y="378">84%</text>

<text class="h" x="80" y="500">Full (default)</text><text class="b" x="80" y="528">time, weather, battery with percentage</text>
<rect class="pill" x="560" y="470" width="410" height="64" rx="32"/>
<text class="t" x="592" y="511">12:45</text>
<circle class="g" cx="708" cy="502" r="7"/>
<text class="p" x="724" y="508">18°</text>
<rect class="g" x="842" y="492" width="34" height="18" rx="4"/><rect class="gf" x="845" y="495" width="24" height="12" rx="2"/><rect class="gf" x="878" y="498" width="3" height="6"/>
<text class="p" x="892" y="508">84%</text>

<line x1="80" y1="590" x2="1520" y2="590" stroke="#fff" stroke-opacity=".15"/>

<text class="h" x="80" y="660">With a camera cutout</text>
<text class="b" x="80" y="690">The pill widens around the cutout;</text>
<text class="b" x="80" y="714">content sits on either side of it.</text>
<rect class="box" x="420" y="620" width="760" height="150" rx="28"/>
<rect class="pill" x="560" y="636" width="480" height="52" rx="26"/>
<text class="t2" x="590" y="671">12:45</text>
<circle class="g" cx="704" cy="662" r="6"/>
<text class="p" x="718" y="668">18°</text>
<rect class="g" x="896" y="653" width="30" height="16" rx="4"/><rect class="gf" x="899" y="656" width="20" height="10" rx="2"/><rect class="gf" x="928" y="659" width="3" height="4"/>
<text class="p" x="940" y="668">84%</text>
<circle cx="800" cy="662" r="15" fill="#000" stroke="#fff" stroke-opacity=".6" stroke-width="1.5"/>

<text x="80" y="866" class="ca">Design illustration, not a screenshot. Sample values; the real pill follows the layout code.</text>
</svg>
