<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif">
  <title>NOVA PILL hero: the pill on black</title>
  <rect x="0" y="0" width="1600" height="900" fill="#000000"/>

  <!-- the pill -->
  <rect x="500" y="300" width="600" height="130" rx="65" ry="65" fill="#0B0B0D" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="560" cy="365" r="10" fill="#E5173F"/>
  <text x="596" y="381" font-size="46" font-weight="700" fill="#FFFFFF">12:45</text>
  <text x="1040" y="381" font-size="28" text-anchor="end" fill="#FFFFFF" fill-opacity="0.72">84%</text>

  <!-- name and line -->
  <text x="800" y="570" font-size="92" font-weight="700" letter-spacing="6" text-anchor="middle" fill="#FFFFFF">NOVA PILL</text>
  <text x="800" y="632" font-size="34" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.72">Live Island for Android</text>

  <!-- status -->
  <rect x="762" y="682" width="76" height="44" rx="6" ry="6" fill="none" stroke="#E5173F" stroke-width="2"/>
  <text x="800" y="714" font-size="24" font-weight="700" text-anchor="middle" fill="#E5173F">V2</text>

  <text x="800" y="836" font-size="18" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.3">Design illustration, not a screenshot</text>
</svg>
