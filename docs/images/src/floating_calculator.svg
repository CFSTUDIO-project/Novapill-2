<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<title>NOVA PILL floating calculator</title>
<style>
text{font-family:Inter,'DejaVu Sans',Helvetica,Arial,sans-serif;fill:#fff}
.ti{font-size:34px;font-weight:700}
.su{font-size:19px;fill-opacity:.6}
.ca{font-size:15px;fill-opacity:.4}
.h{font-size:21px;font-weight:700}
.b{font-size:18px;fill-opacity:.75}
.m{font-size:16px;fill-opacity:.65}
.bar{font-size:14px;fill-opacity:.6;letter-spacing:2px}
.exp{font-size:22px;fill-opacity:.6;text-anchor:end}
.res{font-size:44px;font-weight:700;text-anchor:end}
.k{font-size:24px;font-weight:600;text-anchor:middle}
.bd{font-size:15px;font-weight:700;text-anchor:middle}
.box{fill:#0B0B0D;stroke:#fff;stroke-opacity:.3;stroke-width:1.5}
.win{fill:#0B0B0D;stroke:#fff;stroke-opacity:.45;stroke-width:1.5}
.key{fill:#16161A;stroke:#fff;stroke-opacity:.12;stroke-width:1}
.keya{fill:#E5173F}
.g{fill:none;stroke:#fff;stroke-opacity:.8;stroke-width:2}
.bdg{fill:#000;stroke:#E5173F;stroke-width:2}
</style>
<rect width="1600" height="900" fill="#000"/>
<text x="80" y="92" class="ti">Floating calculator</text>
<text x="80" y="130" class="su">NOVA PILL's own window. It works wherever overlays are allowed.</text>

<rect class="win" x="120" y="170" width="420" height="600" rx="22"/>
<path d="M120 192a22 22 0 0 1 22-22H518a22 22 0 0 1 22 22V226H120Z" fill="#16161A"/>
<text class="bar" x="146" y="204">CALCULATOR</text>
<path class="g" d="M494 190l20 20M514 190l-20 20"/>
<rect x="148" y="244" width="364" height="96" rx="14" fill="#050506" stroke="#fff" stroke-opacity=".15"/>
<text class="exp" x="492" y="278">12 × 8</text><text class="res" x="492" y="324">96</text>

<rect class="key" x="148" y="364" width="82" height="66" rx="14"/><text class="k" x="189" y="406">C</text>
<rect class="key" x="242" y="364" width="82" height="66" rx="14"/><text class="k" x="283" y="406">⌫</text>
<rect class="key" x="336" y="364" width="82" height="66" rx="14"/><text class="k" x="377" y="406">%</text>
<rect class="key" x="430" y="364" width="82" height="66" rx="14"/><text class="k" x="471" y="406">÷</text>
<rect class="key" x="148" y="442" width="82" height="66" rx="14"/><text class="k" x="189" y="484">7</text>
<rect class="key" x="242" y="442" width="82" height="66" rx="14"/><text class="k" x="283" y="484">8</text>
<rect class="key" x="336" y="442" width="82" height="66" rx="14"/><text class="k" x="377" y="484">9</text>
<rect class="key" x="430" y="442" width="82" height="66" rx="14"/><text class="k" x="471" y="484">×</text>
<rect class="key" x="148" y="520" width="82" height="66" rx="14"/><text class="k" x="189" y="562">4</text>
<rect class="key" x="242" y="520" width="82" height="66" rx="14"/><text class="k" x="283" y="562">5</text>
<rect class="key" x="336" y="520" width="82" height="66" rx="14"/><text class="k" x="377" y="562">6</text>
<rect class="key" x="430" y="520" width="82" height="66" rx="14"/><text class="k" x="471" y="562">−</text>
<rect class="key" x="148" y="598" width="82" height="66" rx="14"/><text class="k" x="189" y="640">1</text>
<rect class="key" x="242" y="598" width="82" height="66" rx="14"/><text class="k" x="283" y="640">2</text>
<rect class="key" x="336" y="598" width="82" height="66" rx="14"/><text class="k" x="377" y="640">3</text>
<rect class="key" x="430" y="598" width="82" height="66" rx="14"/><text class="k" x="471" y="640">+</text>
<rect class="key" x="148" y="676" width="82" height="66" rx="14"/><text class="k" x="189" y="718">±</text>
<rect class="key" x="242" y="676" width="82" height="66" rx="14"/><text class="k" x="283" y="718">0</text>
<rect class="key" x="336" y="676" width="82" height="66" rx="14"/><text class="k" x="377" y="718">.</text>
<rect class="keya" x="430" y="676" width="82" height="66" rx="14"/><text class="k" x="471" y="718">=</text>
<path class="g" d="M512 764l20-20M524 764l8-8"/>

<circle class="bdg" cx="372" cy="198" r="14"/><text class="bd" x="372" y="203">1</text>
<circle class="bdg" cx="494" cy="150" r="14"/><text class="bd" x="494" y="155">2</text>
<circle class="bdg" cx="568" cy="768" r="14"/><text class="bd" x="568" y="773">3</text>
<path stroke="#E5173F" stroke-width="1.5" fill="none" d="M494 164V186"/>

<text class="h" x="680" y="204">1  Drag by the title bar</text>
<text class="h" x="680" y="244">2  Close with the X button</text>
<text class="h" x="680" y="284">3  Resize from the bottom-right corner</text>
<text class="m" x="680" y="312">Size is kept inside the screen. Width and height are set under Settings, Floating windows.</text>

<rect class="box" x="680" y="380" width="840" height="340" rx="18"/>
<text class="h" x="712" y="424">Internal floating calculator</text>
<text class="b" x="712" y="456">Drawn by NOVA PILL itself, so it works wherever overlays are allowed.</text>
<text class="h" x="712" y="528">Freeform windows for other apps</text>
<text class="b" x="712" y="560">Requested through the public ActivityOptions API only.</text>
<text class="b" x="712" y="590">Honoured only where the device has freeform windowing enabled.</text>
<text class="b" x="712" y="620">Elsewhere the app opens normally and the pill says so.</text>
<text class="m" x="712" y="680">These are two different things; the calculator never claims to be an app window.</text>
<text x="80" y="866" class="ca">Design illustration, not a screenshot. Key layout simplified.</text>
</svg>
