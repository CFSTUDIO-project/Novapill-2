name: Android build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK and run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      # The APK comes first so a failing unit test never hides a build that worked.
      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-pill-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Write job summary
        run: |
          APK="$(ls app/build/outputs/apk/debug/*.apk | head -n 1)"
          {
            echo "### NOVA PILL debug APK"
            echo ""
            echo "\`$(basename "$APK")\`, $(du -h "$APK" | cut -f1)"
            echo ""
            echo "Download it from the **Artifacts** section at the bottom of this run's page."
            echo "It is a debug build signed with the default debug key. There is no release keystore in this repository."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14

      # Informational: lint findings are uploaded for reading but do not fail the build.
      - name: Android Lint
        continue-on-error: true
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
